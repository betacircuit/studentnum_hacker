<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이름·학번 조회 (샘플)</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c2330;
      --muted: #5f6b7d;
      --line: #dde2ea;
      --accent: #2557d6;
      --accent-soft: #e6edff;
      --mark: #ffe58a;
      --warn-bg: #fff4d6;
      --warn-text: #6b4a00;
      --warn-line: #f0d98a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e8ebf1;
        --muted: #9aa6b8;
        --line: #2b3240;
        --accent: #7aa2ff;
        --accent-soft: #232c45;
        --mark: #7a6200;
        --warn-bg: #3a2f10;
        --warn-text: #f3d98b;
        --warn-line: #5c4a16;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; font-size: 0.92rem; }
    .banner {
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .search {
      position: relative;
    }
    #q {
      width: 100%;
      font: inherit;
      font-size: 1.05rem;
      padding: 14px 44px 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
    }
    #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    #q::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
    #clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: 0; background: transparent; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; padding: 6px 10px; border-radius: 8px;
    }
    #clear[hidden] { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .chip {
      font: inherit; font-size: 0.85rem; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 4px 12px; border-radius: 999px;
    }
    .chip:hover { background: var(--accent-soft); }
    .meta { color: var(--muted); font-size: 0.85rem; margin: 14px 2px 8px; min-height: 1.3em; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px;
    }
    .who { min-width: 0; }
    .name { font-weight: 600; font-size: 1.05rem; }
    .sid { font-variant-numeric: tabular-nums; font-size: 1.05rem; letter-spacing: 0.02em; }
    .detail { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
    .copy {
      flex: none; font: inherit; font-size: 0.82rem; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--accent);
      border-radius: 8px; padding: 6px 10px;
    }
    .copy:hover { background: var(--accent-soft); }
    .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
    footer { color: var(--muted); font-size: 0.8rem; margin-top: 28px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <main>
    <h1>이름 · 학번 조회</h1>
    <p class="sub">이름을 입력하면 학번이, 학번(일부 숫자도 가능)을 입력하면 이름이 나옵니다.</p>

    <div class="banner" role="note">
      ⚠ <strong>가상 샘플 데이터 데모</strong>입니다. 표시되는 이름과 학번(2099-…)은 모두 지어낸 값이며 실제 학생 정보가 아닙니다.
    </div>

    <label class="sr" for="q">이름 또는 학번</label>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="이름 또는 학번 입력" autofocus>
      <button id="clear" type="button" aria-label="입력 지우기" hidden>×</button>
    </div>

    <div class="chips" id="chips" aria-label="검색 예시"></div>
    <div class="meta" id="meta" aria-live="polite"></div>
    <ul id="results"></ul>

    <footer>데이터는 data/ 폴더의 가상 CSV에서 scripts/build_data.py로 생성됩니다.</footer>
  </main>

  <script src="data.js"></script>
  <script src="lookup.js"></script>
  <script src="app.js"></script>
</body>
</html>
