<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080d">
  <title>전정 · Dial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="observatory">
    <h1 class="sr">전정 25학번 이름·학번 다이얼</h1>
    <div class="emblem" aria-label="전정 다이얼 로고" role="img">
      <svg viewBox="0 0 320 320" aria-hidden="true">
        <defs><radialGradient id="halo"><stop stop-color="#24b9e8" stop-opacity=".13"/><stop offset="1" stop-color="#24b9e8" stop-opacity="0"/></radialGradient></defs>
        <circle cx="160" cy="160" r="159" fill="url(#halo)"/>
        <circle class="orbit outer" cx="160" cy="160" r="148" fill="none" stroke="#ceb66b" stroke-width="2" stroke-dasharray="5 11"/>
        <circle class="orbit blue" cx="160" cy="160" r="132" fill="none" stroke="#4fc8f1" stroke-width="1.5"/>
        <circle cx="160" cy="160" r="110" fill="none" stroke="#bfa362" stroke-opacity=".5"/>
        <g stroke="#dbc079" stroke-width="3" stroke-linecap="round"><path d="M160 32v24 M160 264v24 M32 160h24 M264 160h24"/></g>
        <g stroke="#50c6ed" stroke-width="2.5" stroke-linecap="round"><path d="m68 68 17 17 m147-17-17 17 m-147 147 17-17 m147 17-17-17"/></g>
        <g fill="#d7b74e"><circle cx="160" cy="160" r="62" fill="#090e15" stroke="#d4b64f" stroke-width="3"/><circle cx="160" cy="76" r="3.5"/><circle cx="244" cy="160" r="3.5"/><circle cx="160" cy="244" r="3.5"/><circle cx="76" cy="160" r="3.5"/></g>
        <path d="m160 111 42 73h-84z" fill="none" stroke="#42c6f2" stroke-width="2.5"/>
        <circle cx="160" cy="160" r="23" fill="#090e15" stroke="#d5b97a" stroke-width="2.5"/><circle class="core" cx="160" cy="160" r="8" fill="#41c7f4"/>
      </svg>
    </div>
    <section class="instrument" aria-label="이름·학번 검색">
      <div class="plate number-plate">
        <span class="edge-pointer left" aria-hidden="true">▸</span>
        <div class="number-dial" id="number-dial" role="group" aria-label="학번 다이얼"></div>
        <span class="edge-pointer right" aria-hidden="true">◂</span>
        <div class="calibration" aria-hidden="true"></div>
      </div>
      <form class="number-entry" id="number-form">
        <label class="sr" for="number-input">학번 숫자 입력</label>
        <input id="number-input" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="···" aria-label="학번 숫자 입력">
        <button type="submit" class="icon" aria-label="학번 검색" title="학번 검색">↵</button>
      </form>
      <div class="coupling" aria-hidden="true"><span></span><i></i><span></span></div>
      <div class="name-assembly">
        <div class="plate name-plate"><div id="name-dial" class="name-dial" role="group" aria-label="이름 결과 다이얼"></div></div>
      </div>
      <form id="name-form" class="name-entry" autocomplete="off">
        <label class="sr" for="name-input">이름 입력</label>
        <input id="name-input" type="text" aria-label="이름 입력" role="combobox" aria-controls="name-suggestions" aria-expanded="false" aria-autocomplete="list" maxlength="80" placeholder="이름">
        <button type="submit" class="icon" aria-label="이름 검색">↵</button>
        <div id="name-suggestions" class="name-suggestions" role="listbox" aria-label="등록된 이름 후보" hidden></div>
      </form>
      <div id="full-name" class="full-name" hidden></div>
      <div id="readout" class="readout" hidden>
        <div class="small-info"><span id="status-dot" class="status-dot"></span><span id="department"></span><button id="warning" class="warning" type="button" aria-label="미확인 정보 제안" title="미확인 정보 제안" hidden>⚠</button></div>
        <div id="candidates" class="candidates"></div>
        <div class="result-controls"><button id="prev-result" class="icon" aria-label="이전 이름 후보" hidden>‹</button><span id="result-count"></span><button id="next-result" class="icon" aria-label="다음 이름 후보" hidden>›</button></div>
        <button id="request" class="request" type="button">정보 수정 요청</button>
      </div>
      <p class="sr" id="announcement" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="suggest-dialog" class="dialog suggest-dialog">
    <div class="dialog-top"><span>정보 수정 요청</span><button class="icon close" data-close="suggest-dialog" aria-label="닫기">×</button></div>
    <p id="suggest-message">이 사람과 관련한 정보를 제안해주세요.</p>
    <form id="suggest-form">
      <label>이름<input id="suggest-name" name="name" required maxlength="80"></label>
      <label>학번<input id="suggest-id" name="id" inputmode="numeric" placeholder="2025-1????" pattern="2025-1[0-9]{4}" maxlength="10"></label>
      <label>학부<input id="suggest-dept" name="department" maxlength="80"></label>
      <label>제안 내용<textarea id="suggest-note" name="note" rows="3" required maxlength="1500"></textarea></label>
      <button class="submit-request" type="submit">수정 요청 보내기 ↗</button>
      <p class="form-note">새 창에서 최종 제출해주세요.</p>
      <a id="request-fallback" target="_blank" rel="noopener noreferrer" hidden>요청 제출 화면 열기 ↗</a>
    </form>
  </dialog>
  <script src="data.js"></script>
  <script src="lookup.js"></script>
  <script src="dial.js"></script>
  <script src="app.js"></script>
</body>
</html>
